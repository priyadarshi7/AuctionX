services:
  postgres:
    image: postgres:16-alpine
    container_name: auctionx-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: auctionx
      POSTGRES_PASSWORD: auctionx_dev_password
      POSTGRES_DB: auctionx
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U auctionx']
      interval: 5s
      timeout: 5s
      retries: 10

  # No volume: rate-limit counters are ephemeral and non-critical (Redis is
  # never the source of truth, CLAUDE.md Section 12) — losing them on
  # restart just resets everyone's throttle window, which is harmless.
  #
  # Host port deliberately NOT 6379 (ADR-0028): on this dev machine, WSL2's
  # own automatic localhost-forwarding (wslrelay.exe) exposes some other
  # project's native Redis at 127.0.0.1:6379, bound more specifically than
  # this container's wildcard (0.0.0.0:6379) publish via Docker Desktop's
  # forwarder — Windows/Node's `localhost` resolution picks the more
  # specific loopback bind, so the app was silently talking to a different,
  # unrelated Redis instance the entire time. The container's own internal
  # port stays 6379 (Redis's real default, irrelevant to the host) — only
  # the host-side mapping moves, to a port nothing else on this machine has
  # claimed.
  redis:
    image: redis:7-alpine
    container_name: auctionx-redis
    restart: unless-stopped
    ports:
      - '6380:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  # s3mock (Adobe, Apache-2.0, actively maintained): the local, self-hosted
  # stand-in for Cloudflare R2 (CLAUDE.md Section 27/83) for object storage.
  # Two earlier choices were tried and abandoned here, for real reasons
  # worth recording:
  #   - MinIO: `docker pull minio/minio` (and every public mirror tried —
  #     quay.io, ghcr.io) now returns "access denied" — MinIO restricted
  #     anonymous Docker distribution of their images sometime in 2025.
  #   - LocalStack: pulls fine, but `latest` (and every currently-listed
  #     tag) now refuses to start at all without a LOCALSTACK_AUTH_TOKEN
  #     from a LocalStack account — even for the free community S3 service,
  #     which defeats the entire point of a fully self-hosted local stack
  #     (Section 83: local dev must never require a live third-party
  #     account, the same reasoning that ruled out Cloudinary).
  # s3mock has neither problem: no login, no bucket pre-creation needed via
  # a fragile init step either — infrastructure/storage/s3Client.ts's
  # `ensureBucketExists` creates it idempotently at boot, which also means
  # this same code path works unmodified against a real bucket in
  # production (a no-op there, since the bucket already exists).
  # Unlike Redis (genuinely disposable cache data), an uploaded image is
  # real content a developer doesn't want to silently lose — a volume here
  # matches Postgres's precedent, not Redis's. Without this, ANY container
  # recreate (not just a full `docker compose down` — this bit a real
  # session on 2026-09-28 via an unrelated healthcheck fix, see PROGRESS.md)
  # silently wipes every previously-uploaded object while Postgres keeps
  # referencing the now-dead URLs, which looks exactly like a rendering bug
  # from the frontend but isn't one.
  #
  # `COM_ADOBE_TESTING_S3MOCK_STORE_ROOT`/`_RETAINFILESONEXIT`: by default
  # this image stores objects in an ephemeral `/tmp` path and explicitly
  # deletes them on exit regardless of any volume mount — confirmed by
  # reading its actual Spring property names out of the image's own
  # bytecode (`COM_ADOBE_TESTING_S3MOCK_STORE_ROOT` was not documented
  # anywhere obvious), not guessed. Both are required together; a volume
  # alone does nothing here.
  #
  # `user: "0:0"`: a fresh Docker named volume mounts owned by root, but
  # this image's default user is a non-root uid — without running as root,
  # every write fails with an internal error the moment the app tries to
  # create its store directory. Local-dev-only container, so running as
  # root is a pragmatic simplification, not a production security decision.
  s3mock:
    image: adobe/s3mock:latest
    container_name: auctionx-s3mock
    restart: unless-stopped
    user: '0:0'
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_ROOT: /data
      COM_ADOBE_TESTING_S3MOCK_STORE_RETAINFILESONEXIT: 'true'
    ports:
      - '9090:9090'
    volumes:
      - s3mock_data:/data
    # `curl` doesn't exist in this image (a minimal buildpacks/JVM base) —
    # confirmed via `docker exec`, not assumed. `wget` (BusyBox) does.
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://localhost:9090/']
      interval: 5s
      timeout: 5s
      retries: 10

  # Redpanda: Kafka-API-compatible broker for Phase 7 (Section 15/16's
  # Outbox -> Kafka -> consumer pattern, ADR-0027). Chosen over real Apache
  # Kafka specifically for local dev: Kafka + Zookeeper (or even KRaft-mode
  # Kafka) is a JVM broker with a meaningfully heavier disk/memory
  # footprint, and this machine already has a real, previously-unexplained
  # disk-space problem (see PROGRESS.md's "Project location" section) that
  # turned out to be ~50GB of unrelated Docker images from other projects,
  # not this one — but a genuinely disk-constrained dev machine is still
  # the reality this choice is made for. Redpanda speaks the real Kafka
  # wire protocol (same client libraries — kafkajs — same topics/
  # partitions/consumer-group semantics everything in CLAUDE.md's Kafka
  # sections describes), as a single ~400MB C++ binary with no separate
  # coordination service, verified with a real `docker pull` + start +
  # `rpk cluster health` before adopting it, not assumed.
  #
  # Single-node dev flags (`--overprovisioned`, `--smp=1`, `--memory=1G`):
  # this is explicitly a local single-broker setup, not tuned for
  # throughput — matches every other piece of local infra in this compose
  # file (one Postgres, one Redis, one s3mock).
  redpanda:
    image: redpandadata/redpanda:latest
    container_name: auctionx-redpanda
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --overprovisioned
      - --node-id=0
      - --check=false
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://localhost:9092
    ports:
      - '9092:9092'
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    healthcheck:
      test: ['CMD-SHELL', 'rpk cluster health | grep -E "Healthy:.+true" || exit 1']
      interval: 10s
      timeout: 5s
      retries: 10

  # OpenSearch: Phase 9 (Section 25) search. Verified with a real
  # `docker pull` + start + `_cluster/health` before adopting it (same
  # discipline as Redpanda/s3mock) — a genuine concern given this project's
  # history of Docker/WSL2 startup friction (the redis port-6379 collision,
  # ADR-0028), and OpenSearch/Elasticsearch's own documented history of
  # needing a bumped `vm.max_map_count` on Linux hosts. Neither problem
  # showed up here: this machine's Docker Desktop WSL2 VM already has
  # enough headroom, cluster went GREEN in ~10s. Single-node, security
  # plugin disabled (`DISABLE_SECURITY_PLUGIN`) — no TLS/password setup for
  # a local dev instance nothing external can reach, same reasoning as
  # every other piece of local infra here. Heap capped at 512m
  # (OPENSEARCH_JAVA_OPTS) — this is a single small index at dev scale, not
  # tuned for production ingest volume.
  #
  # Unlike Redis (ADR-0005's genuinely-ephemeral rate-limit counters), this
  # DOES get a volume: the index is fully rebuildable from Postgres (Section
  # 25's own diagram — it's derived data, never source of truth), but
  # losing it on every container restart during normal dev work would mean
  # re-running a full reindex just to get search results back, which is
  # real dev-workflow friction the s3mock precedent already established is
  # worth avoiding with a volume.
  opensearch:
    image: opensearchproject/opensearch:2
    container_name: auctionx-opensearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: 'true'
      OPENSEARCH_JAVA_OPTS: '-Xms512m -Xmx512m'
    ports:
      - '9200:9200'
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test: ['CMD-SHELL', "curl -s http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 10s
      timeout: 5s
      retries: 15

  # Ollama: self-hosted, free, local model runtime for Phase 10's AI
  # valuation (Section 20/22, ADR-0032) — chosen over a paid cloud vision
  # API specifically so local dev stays at $0 and needs no account, the same
  # principle Section 83 already applies to object storage/search/Kafka.
  # Model weights are NOT bundled in the image (they're gigabytes,
  # downloaded on first use) — after `docker compose up`, run
  # `npm run ai:pull-model --workspace=services/api` once to actually pull
  # OLLAMA_VISION_MODEL (default `moondream`) into this container. The
  # app boots fine either way; valuation requests just stay
  # PENDING/FAILED until the model has been pulled.
  #
  # Gets a volume (unlike Redis's ephemeral counters) for the same reason
  # OpenSearch's index does: re-downloading gigabytes of model weights on
  # every container restart would be real, avoidable dev-workflow friction.
  ollama:
    image: ollama/ollama:latest
    container_name: auctionx-ollama
    restart: unless-stopped
    ports:
      - '11434:11434'
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ['CMD-SHELL', 'ollama list || exit 1']
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  s3mock_data:
  redpanda_data:
  opensearch_data:
  ollama_data:
